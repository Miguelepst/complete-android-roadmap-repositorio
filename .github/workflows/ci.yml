name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Caché de código abierto (MIT). La "mejorada" viene por defecto y es
          # un componente propietario con términos de uso propios.
          cache-provider: basic
      - name: Diagnostico del entorno (temporal)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          java -version
          free -m
          nproc
      - name: Check
        run: ./gradlew check --console=plain